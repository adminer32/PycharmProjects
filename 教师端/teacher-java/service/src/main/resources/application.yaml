    path: /swagger-ui.html # 默认路径

# Sa-Token 配置
sa-token:
  # Token 名称 (对应前端 Header)
  token-name: auth-token
  # Token 有效期，单位秒，默认30天 (-1表示永久有效)
  timeout: 300000
  # Token 最低活跃频繁度，单位秒，默认-1
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # Token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 文件上传配置
